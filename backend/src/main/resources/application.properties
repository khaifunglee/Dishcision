# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/dishcision_db
# Hide when committing to github
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (allows for auto create/update DB based on Java classes in postgresql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App port
server.port=8080

# JWT secret (hide)
jwt.secret=
jwt.expiration=86400000

spring.application.name=backend

# Serialise dates as strings, not timestamp numbers
spring.jackson.serialization.write-dates-as-timestamps=false
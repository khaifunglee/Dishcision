# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/dishcision_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (allows for auto create/update DB based on Java classes in postgresql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App port
server.port=8080

# JWT secret
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gmail SMTP (email verification) — sends as a real @gmail.com address
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.application.name=backend

# Serialise dates as strings, not timestamp numbers
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/dishcision_db
# Hide when committing to github
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (allows for auto create/update DB based on Java classes in postgresql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App port
server.port=8080

# JWT secret (hide)
jwt.secret=
jwt.expiration=86400000

# Gmail SMTP (email verification) — sends as a real @gmail.com address so it
# can reach arbitrary recipients without owning/verifying a domain. Set
# GMAIL_USERNAME to the full Gmail address and GMAIL_APP_PASSWORD to a
# Google Account App Password (Security > App Passwords), not the normal
# account password. Empty defaults so the app still starts without them.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.application.name=backend

# Serialise dates as strings, not timestamp numbers
spring.jackson.datatype.datetime.write-dates-as-timestamps=false